<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburgada do Careca</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-28 font-sans">

  <header class="bg-zinc-900 border-b border-zinc-800 p-6 text-center">
    <h1 class="text-3xl font-extrabold text-white uppercase">🍔 Hamburgada do Careca</h1>
    <p class="text-zinc-400 text-sm mt-1">Hambúrguer artesanal de respeito! 🔥</p>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 flex justify-between items-center">
      <div>
        <h3 class="text-lg font-bold text-white">Hambúrguer do Chef</h3>
        <p class="text-xs text-zinc-400">Pão brioche, 150g bovino, gorgonzola, bacon e fritas.</p>
        <span class="text-xl font-black text-amber-400 mt-2 block">R$ 35,00</span>
      </div>
      <button onclick="addToCart('Hambúrguer do Chef', 35.00)" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-4 py-2 rounded-xl text-sm">
        <i class="fa-solid fa-plus"></i> Adicionar
      </button>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 p-4 flex justify-between items-center z-40">
    <div>
      <span class="text-xs text-zinc-400 block">Total</span>
      <span id="cart-total" class="text-xl font-black text-amber-400">R$ 0,00</span>
    </div>
    <button onclick="sendWhatsApp()" class="bg-emerald-600 text-white font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2">
      <i class="fa-brands fa-whatsapp text-lg"></i> Finalizar Pedido
    </button>
  </div>

  <script>
    let cart = [];
    function addToCart(name, price) {
      cart.push({ name, price });
      document.getElementById('cart-total').innerText = 'R$ ' + price.toFixed(2).replace('.', ',');
    }
    function sendWhatsApp() {
      if (cart.length === 0) {
        alert('Selecione um lanche primeiro!');
        return;
      }
      let msg = "╔═══════════════════════╗\n";
      msg += "     🍔 *NOVO PEDIDO* 🍔\n";
      msg += "   *Hamburgada do Careca*\n";
      msg += "╚═══════════════════════╝\n\n";
      msg += "🛒 *ITENS DO PEDIDO:*\n";
      cart.forEach(item => {
        msg += "• 1x " + item.name + " — R$ " + item.price.toFixed(2).replace('.', ',') + "\n";
      });
      msg += "\n💰 *TOTAL: R$ 35,00*";
      window.open("https://api.whatsapp.com/send?phone=555198163012&text=" + encodeURIComponent(msg), "_blank");
    }
  </script>
</body>
</html>
